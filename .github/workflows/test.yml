name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # Corepack otherwise asks for confirmation before fetching the pinned
      # Yarn release, which a non-interactive job cannot answer.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Corepack honours the `packageManager` field (yarn@4.10.3). Enabled
      # before setup-node so the yarn cache lookup below can resolve.
      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Must satisfy both this repo's `engines` (>=20.9.0) and Angular
          # 21's (^20.19.0 || ^22.12.0 || >=24.0.0).
          node-version: '22.x'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test

      - name: Lint ng-content selectors (parity guard)
        run: yarn parity:lint-ng-content

      - name: Check hardcoded tokens in core scss (parity guard)
        run: yarn parity:check-tokens

      - name: Angular Storybook AOT build (catch template regressions)
        run: yarn ng:build-storybook
